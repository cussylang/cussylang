[package]
name = "cussy"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "C, but somebody opened Desmos. A checked language with native compilation, an interpreter, and graphing."
license = "MIT AND BSL-1.0"
repository = "https://github.com/cussylang/cussylang"
homepage = "https://github.com/cussylang/cussylang"
documentation = "https://github.com/cussylang/cussylang/blob/main/docs/language.md"
readme = "README.md"
keywords = ["language", "compiler", "interpreter", "graphing", "cussy"]
categories = ["compilers", "command-line-utilities"]
include = ["src/**", "mobile/runtime/Cargo.toml", "mobile/runtime/src/**", "mobile/include/**", "stdlib/**", "docs/**", "examples/**", "tests/**", "benchmarks/**", "scripts/**", "editors/**", "research/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"

[workspace]
members = ["mobile/runtime"]
default-members = ["."]
resolver = "3"
