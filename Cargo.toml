[package]
name = "cussy"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "C, but somebody opened Desmos. A statically checked interpreter with catastrophic jole exposure."
license = "MIT"
repository = "https://github.com/cussylang/cussylang"
homepage = "https://github.com/cussylang/cussylang"
documentation = "https://github.com/cussylang/cussylang/blob/main/docs/language.md"
readme = "README.md"
keywords = ["language", "interpreter", "graphing", "cussy"]
categories = ["compilers", "command-line-utilities"]
include = ["src/**", "stdlib/**", "docs/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
