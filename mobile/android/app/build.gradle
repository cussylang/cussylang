plugins {
    id 'com.android.application'
}

android {
    namespace 'org.cussylang.android'
    compileSdk 36
    ndkVersion '27.2.12479018'
    sourceSets {
        main { assets.srcDir rootProject.file('../assets') }
    }

    defaultConfig {
        applicationId 'org.cussylang.android'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        def cussyAbis = (project.findProperty('cussyAbis') ?: 'arm64-v8a,x86_64').split(',')
        if (!cussyAbis.every { it in ['arm64-v8a', 'x86_64'] }) {
            throw new GradleException('cussyAbis must contain arm64-v8a and/or x86_64, separated by commas.')
        }
        ndk { abiFilters.addAll(cussyAbis) }
        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
