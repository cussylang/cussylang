name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    uses: ./.github/workflows/mobile.yml

  check:
    name: Check (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        rust: [stable]
        include:
          - os: ubuntu-22.04
            rust: msrv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CUSSY_REQUIRE_NATIVE: "1"
      CUSSY_CC: ${{ matrix.rust == 'msrv' && 'gcc' || 'clang' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Rust
        env:
          RUST_CHANNEL: ${{ matrix.rust }}
        run: |
          toolchain="$RUST_CHANNEL"
          if [ "$toolchain" = msrv ]; then
            toolchain=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          fi
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup override set "$toolchain"
      - name: Verify native compiler
        run: '"$CUSSY_CC" --version'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
      - name: Package and test extracted distribution
        run: python scripts/package.py --smoke-test
