name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mobile:
    uses: ./.github/workflows/mobile.yml

  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CUSSY_REQUIRE_NATIVE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install minimum supported Rust
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup override set "$toolchain"
          rustup target add "${{ matrix.target }}"
      - name: Check release version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Verify native compiler
        run: clang --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and test extracted distribution
        run: python scripts/package.py --target ${{ matrix.target }} --kind binary --verify-tag "$GITHUB_REF_NAME" --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all platforms
    needs: [build, mobile]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Package source and editor extension
        run: python scripts/package.py --kind source --verify-tag "$GITHUB_REF_NAME"
      - name: Verify complete asset set and write checksums
        run: |
          python - <<'PY'
          import pathlib, tomllib
          version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          suffixes = {"linux-x64.tar.gz", "macos-arm64.tar.gz", "macos-x64.tar.gz", "windows-x64.zip", "source.tar.gz", "vscode-starter.zip", "android.apk", "ios-runtime.zip", "ios-unsigned.ipa"}
          expected = {f"cussy-{version}-{suffix}" for suffix in suffixes}
          actual = {p.name for p in pathlib.Path("dist").iterdir() if p.name != "SHA256SUMS"}
          if actual != expected:
              raise SystemExit(f"Incomplete release: missing={expected - actual}, unexpected={actual - expected}")
          PY
          cd dist
          sha256sum *.tar.gz *.zip *.apk *.ipa > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
