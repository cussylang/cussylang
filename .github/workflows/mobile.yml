name: Mobile

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android app and emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Rust and Android SDK components
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Build mobile runtime and APK
        run: |
          python3 scripts/build_mobile.py android
          cd mobile/android
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Boot Android emulator
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/cussy-android
          ANDROID_AVD_HOME: ${{ runner.temp }}/cussy-avd
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name cussy --package 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/cussy.avd" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx cussy
          nohup "$ANDROID_HOME/emulator/emulator" -avd cussy -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics > "$RUNNER_TEMP/cussy-emulator.log" 2>&1 &
          cussy_emulator_pid=$!
          sleep 2
          if ! kill -0 "$cussy_emulator_pid"; then
            cat "$RUNNER_TEMP/cussy-emulator.log"
            exit 1
          fi
          if ! timeout 300 adb wait-for-device; then
            cat "$RUNNER_TEMP/cussy-emulator.log"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 3
          done
          cat "$RUNNER_TEMP/cussy-emulator.log"
          exit 1
      - name: Run actual app runtime tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Capture Android app
        run: |
          adb shell am start -n org.cussylang.android/.MainActivity
          sleep 2
          adb exec-out screencap -p > mobile/build/android.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-android
          path: mobile/build/android.png
      - name: Package Android app
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M)[1]
          pathlib.Path('dist').mkdir(exist_ok=True)
          shutil.copy2('mobile/android/app/build/outputs/apk/debug/app-debug.apk', f'dist/cussy-{version}-android.apk')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-diagnostics
          path: |
            mobile/android/app/build/reports
            mobile/android/app/build/outputs/androidTest-results
            ${{ runner.temp }}/cussy-emulator.log

  ios:
    name: iOS app and simulator
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build device and simulator runtime
        run: python3 scripts/build_mobile.py ios
      - name: Select installed iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [d for runtime, ds in devices.items() if '.iOS-' in runtime for d in ds if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('CUSSY_SIMULATOR=' + phones[0]['udid'] + '\n')
          PY
      - name: Run actual app runtime tests in iOS Simulator
        run: |
          xcodebuild -project mobile/ios/Cussy.xcodeproj -scheme Cussy -destination "platform=iOS Simulator,id=$CUSSY_SIMULATOR" -derivedDataPath mobile/build/ios-tests -resultBundlePath mobile/build/ios-tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Capture iOS app
        run: |
          xcrun simctl boot "$CUSSY_SIMULATOR" || true
          xcrun simctl bootstatus "$CUSSY_SIMULATOR" -b
          xcrun simctl install "$CUSSY_SIMULATOR" mobile/build/ios-tests/Build/Products/Debug-iphonesimulator/Cussy.app
          xcrun simctl launch --terminate-running-process "$CUSSY_SIMULATOR" org.cussylang.Cussy
          sleep 2
          xcrun simctl io "$CUSSY_SIMULATOR" screenshot mobile/build/ios.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-ios
          path: mobile/build/ios.png
      - name: Build unsigned iPhone and iPad app
        run: |
          xcodebuild -project mobile/ios/Cussy.xcodeproj -scheme Cussy -configuration Release -destination 'generic/platform=iOS' -derivedDataPath mobile/build/ios-device CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS runtime and unsigned app
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M)[1]
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          shutil.make_archive(str(dist / f'cussy-{version}-ios-runtime'), 'zip', 'mobile/build', 'CussyRuntime.xcframework')
          staging = pathlib.Path('mobile/build/ipa')
          (staging / 'Payload').mkdir(parents=True, exist_ok=True)
          shutil.copytree('mobile/build/ios-device/Build/Products/Release-iphoneos/Cussy.app', staging / 'Payload/Cussy.app')
          archive = shutil.make_archive(str(dist / f'cussy-{version}-ios-unsigned'), 'zip', staging)
          pathlib.Path(archive).rename(dist / f'cussy-{version}-ios-unsigned.ipa')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-ios
          path: |
            dist/*.zip
            dist/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload iOS diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-diagnostics
          path: mobile/build/ios-tests.xcresult
